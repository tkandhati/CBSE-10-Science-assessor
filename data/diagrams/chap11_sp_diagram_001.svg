<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">Parallel Circuit — Figure A</text>

  <!--
    Layout:
    Battery on left (x=60). Two vertical bus bars at x=140 (left) and x=400 (right).
    Three parallel branches between x=140 and x=400 at y=100, 180, 260.
    Top wire (y=60) and bottom wire (y=320) connecting battery to bus bars.
  -->

  <!-- Battery (left side) -->
  <!-- Battery symbol: long line (positive) + short line (negative), stacked horizontally -->
  <line x1="60" y1="60"  x2="60" y2="320" stroke="black" stroke-width="2"/>
  <!-- Battery symbol on the left vertical wire -->
  <line x1="50" y1="175" x2="70" y2="175" stroke="black" stroke-width="3"/>  <!-- long = + -->
  <line x1="54" y1="190" x2="66" y2="190" stroke="black" stroke-width="1.5"/><!-- short = - -->
  <line x1="50" y1="205" x2="70" y2="205" stroke="black" stroke-width="3"/>
  <line x1="54" y1="220" x2="66" y2="220" stroke="black" stroke-width="1.5"/>
  <text x="30" y="173" font-family="Arial, sans-serif" font-size="11" fill="black">+</text>
  <text x="30" y="225" font-family="Arial, sans-serif" font-size="11" fill="black">−</text>
  <text x="20" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="black">6V</text>

  <!-- Top horizontal wire -->
  <line x1="60" y1="60" x2="400" y2="60" stroke="black" stroke-width="2"/>
  <!-- Bottom horizontal wire -->
  <line x1="60" y1="320" x2="400" y2="320" stroke="black" stroke-width="2"/>

  <!-- Left vertical bus bar -->
  <line x1="140" y1="60" x2="140" y2="320" stroke="black" stroke-width="2"/>
  <!-- Right vertical bus bar -->
  <line x1="400" y1="60" x2="400" y2="320" stroke="black" stroke-width="2"/>

  <!-- Wire connections from battery side (x=60) to bus bar (x=140) -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="black" stroke-width="2"/>
  <line x1="60" y1="320" x2="140" y2="320" stroke="black" stroke-width="2"/>

  <!-- Branch 1: R1 = 2Ω at y=100 -->
  <line x1="140" y1="100" x2="210" y2="100" stroke="black" stroke-width="2"/>
  <rect x="210" y="88" width="80" height="24" rx="3" fill="white" stroke="black" stroke-width="2"/>
  <text x="250" y="104" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">R₁ = 2 Ω</text>
  <line x1="290" y1="100" x2="400" y2="100" stroke="black" stroke-width="2"/>

  <!-- Branch 2: R2 = 3Ω at y=190 -->
  <line x1="140" y1="190" x2="210" y2="190" stroke="black" stroke-width="2"/>
  <rect x="210" y="178" width="80" height="24" rx="3" fill="white" stroke="black" stroke-width="2"/>
  <text x="250" y="194" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">R₂ = 3 Ω</text>
  <line x1="290" y1="190" x2="400" y2="190" stroke="black" stroke-width="2"/>

  <!-- Branch 3: R3 = 6Ω at y=280 -->
  <line x1="140" y1="280" x2="210" y2="280" stroke="black" stroke-width="2"/>
  <rect x="210" y="268" width="80" height="24" rx="3" fill="white" stroke="black" stroke-width="2"/>
  <text x="250" y="284" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="black">R₃ = 6 Ω</text>
  <line x1="290" y1="280" x2="400" y2="280" stroke="black" stroke-width="2"/>

  <!-- Junction dots -->
  <circle cx="140" cy="100" r="4" fill="black"/>
  <circle cx="140" cy="190" r="4" fill="black"/>
  <circle cx="140" cy="280" r="4" fill="black"/>
  <circle cx="400" cy="100" r="4" fill="black"/>
  <circle cx="400" cy="190" r="4" fill="black"/>
  <circle cx="400" cy="280" r="4" fill="black"/>

  <!-- Info box -->
  <rect x="30" y="340" width="440" height="32" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="250" y="354" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    All resistors share the same voltage (6V). 1/R_eq = 1/2 + 1/3 + 1/6 = 1 Ω
  </text>
  <text x="250" y="368" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    R_equivalent = 1 Ω (parallel combination)
  </text>
</svg>
