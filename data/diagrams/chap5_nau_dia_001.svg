<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="black">Stomatal Pore</text>

  <!-- Surrounding epidermal cells (background) -->
  <rect x="50" y="50" width="400" height="280" rx="10" fill="#e8f5e9" stroke="#aaa" stroke-width="1"/>

  <!-- Epidermal cells (irregular shapes around guard cells) -->
  <polygon points="50,50 200,50 180,130 50,140" fill="#c8e6c9" stroke="#888" stroke-width="1"/>
  <polygon points="300,50 450,50 450,140 320,130" fill="#c8e6c9" stroke="#888" stroke-width="1"/>
  <polygon points="50,210 180,220 200,330 50,330" fill="#c8e6c9" stroke="#888" stroke-width="1"/>
  <polygon points="320,220 450,210 450,330 300,330" fill="#c8e6c9" stroke="#888" stroke-width="1"/>

  <!-- Guard Cell A (top — kidney/bean shaped) -->
  <ellipse cx="250" cy="148" rx="90" ry="30" fill="#4caf50" stroke="#1b5e20" stroke-width="2"
           transform="rotate(-8 250 148)"/>
  <!-- Chloroplasts in top guard cell -->
  <ellipse cx="195" cy="145" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="215" cy="138" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="238" cy="135" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="262" cy="136" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="285" cy="140" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="305" cy="148" rx="8" ry="4" fill="#1b5e20"/>

  <!-- Guard Cell A (bottom — kidney/bean shaped) -->
  <ellipse cx="250" cy="232" rx="90" ry="30" fill="#4caf50" stroke="#1b5e20" stroke-width="2"
           transform="rotate(8 250 232)"/>
  <!-- Chloroplasts in bottom guard cell -->
  <ellipse cx="195" cy="234" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="215" cy="240" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="238" cy="243" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="262" cy="242" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="285" cy="238" rx="8" ry="4" fill="#1b5e20"/>
  <ellipse cx="305" cy="230" rx="8" ry="4" fill="#1b5e20"/>

  <!-- Stomatal Pore B (centre gap) -->
  <ellipse cx="250" cy="190" rx="30" ry="38" fill="white" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="250" y="193" font-family="Arial, sans-serif" font-size="10" text-anchor="middle"
        fill="#333">Pore</text>

  <!-- Label A: Guard Cell -->
  <line x1="345" y1="148" x2="400" y2="120" stroke="#333" stroke-width="1.5"/>
  <text x="402" y="116" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">A</text>
  <text x="402" y="130" font-family="Arial, sans-serif" font-size="11" fill="#333">Guard Cell</text>

  <!-- Label A bottom guard cell -->
  <line x1="345" y1="232" x2="400" y2="258" stroke="#333" stroke-width="1.5"/>
  <text x="402" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">A</text>
  <text x="402" y="276" font-family="Arial, sans-serif" font-size="11" fill="#333">Guard Cell</text>

  <!-- Label B: Stomatal Pore -->
  <line x1="218" y1="190" x2="100" y2="190" stroke="#333" stroke-width="1.5"/>
  <text x="55" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="black">B</text>
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="11" fill="#333">Stomatal</text>
  <text x="30" y="214" font-family="Arial, sans-serif" font-size="11" fill="#333">Pore</text>

  <!-- Chloroplast legend -->
  <ellipse cx="80" cy="340" rx="10" ry="5" fill="#1b5e20"/>
  <text x="96" y="344" font-family="Arial, sans-serif" font-size="11" fill="#333">Chloroplasts</text>
  <text x="250" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    Guard cells regulate opening and closing of the stomatal pore
  </text>
</svg>
