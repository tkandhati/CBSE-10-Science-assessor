<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="26" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">Longitudinal Section of a Flower</text>

  <!-- Receptacle / base -->
  <ellipse cx="250" cy="340" rx="80" ry="16" fill="#795548" stroke="#4e342e" stroke-width="1.5"/>
  <rect x="230" y="305" width="40" height="40" rx="5" fill="#795548" stroke="#4e342e" stroke-width="1.5"/>

  <!-- Sepal (green, outer) -->
  <ellipse cx="175" cy="270" rx="20" ry="60" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"
           transform="rotate(-25 175 270)"/>
  <ellipse cx="325" cy="270" rx="20" ry="60" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5"
           transform="rotate(25 325 270)"/>

  <!-- C: Petals (pink, outer floral parts) -->
  <!-- Left petal -->
  <ellipse cx="158" cy="210" rx="30" ry="80" fill="#f48fb1" stroke="#c2185b" stroke-width="1.5"
           transform="rotate(-20 158 210)"/>
  <!-- Right petal -->
  <ellipse cx="342" cy="210" rx="30" ry="80" fill="#f48fb1" stroke="#c2185b" stroke-width="1.5"
           transform="rotate(20 342 210)"/>
  <!-- Front petal -->
  <ellipse cx="250" cy="175" rx="32" ry="85" fill="#f8bbd0" stroke="#c2185b" stroke-width="1.5"/>

  <!-- Label C: Petal -->
  <line x1="215" y1="150" x2="145" y2="105" stroke="#333" stroke-width="1.5"/>
  <text x="102" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">C</text>
  <text x="102" y="114" font-family="Arial, sans-serif" font-size="11" fill="#c2185b">Petal</text>

  <!-- Pistil: Stigma (A), Style, Ovary (D) -->
  <!-- Style (stalk of pistil) -->
  <rect x="244" y="205" width="12" height="80" rx="4" fill="#fff176" stroke="#f57f17" stroke-width="1.5"/>
  <!-- A: Stigma (top of pistil — sticky top) -->
  <ellipse cx="250" cy="202" rx="16" ry="8" fill="#ffee58" stroke="#f57f17" stroke-width="2"/>
  <!-- D: Ovary (base of pistil) -->
  <ellipse cx="250" cy="295" rx="28" ry="20" fill="#ffe082" stroke="#e65100" stroke-width="2"/>
  <!-- Ovules inside -->
  <ellipse cx="244" cy="295" rx="6" ry="5" fill="#ffb300" stroke="#e65100" stroke-width="1"/>
  <ellipse cx="256" cy="295" rx="6" ry="5" fill="#ffb300" stroke="#e65100" stroke-width="1"/>

  <!-- Label A: Stigma -->
  <line x1="266" y1="202" x2="340" y2="170" stroke="#333" stroke-width="1.5"/>
  <text x="344" y="166" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">A</text>
  <text x="344" y="180" font-family="Arial, sans-serif" font-size="11" fill="#f57f17">Stigma</text>
  <text x="344" y="193" font-family="Arial, sans-serif" font-size="10" fill="#555">(receives pollen)</text>

  <!-- Label D: Ovary -->
  <line x1="278" y1="295" x2="340" y2="315" stroke="#333" stroke-width="1.5"/>
  <text x="344" y="311" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">D</text>
  <text x="344" y="325" font-family="Arial, sans-serif" font-size="11" fill="#e65100">Ovary</text>
  <text x="344" y="338" font-family="Arial, sans-serif" font-size="10" fill="#555">(contains ovules)</text>

  <!-- Stamen: Anther (B) + Filament -->
  <!-- Left stamen -->
  <line x1="210" y1="290" x2="185" y2="220" stroke="#8d6e63" stroke-width="1.5"/>
  <ellipse cx="182" cy="214" rx="10" ry="6" fill="#ff8f00" stroke="#e65100" stroke-width="1.5"/>
  <!-- Right stamen -->
  <line x1="290" y1="290" x2="315" y2="220" stroke="#8d6e63" stroke-width="1.5"/>
  <ellipse cx="318" cy="214" rx="10" ry="6" fill="#ff8f00" stroke="#e65100" stroke-width="1.5"/>

  <!-- Label B: Anther -->
  <line x1="182" y1="208" x2="120" y2="175" stroke="#333" stroke-width="1.5"/>
  <text x="78" y="171" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">B</text>
  <text x="78" y="185" font-family="Arial, sans-serif" font-size="11" fill="#e65100">Anther</text>
  <text x="70" y="198" font-family="Arial, sans-serif" font-size="10" fill="#555">(produces pollen)</text>
</svg>
