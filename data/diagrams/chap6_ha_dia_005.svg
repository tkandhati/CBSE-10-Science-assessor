<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="black">Endocrine Glands</text>

  <!-- Human body outline (simple silhouette) -->
  <!-- Head -->
  <ellipse cx="250" cy="72" rx="38" ry="44" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <!-- Neck -->
  <rect x="234" y="112" width="32" height="24" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <!-- Torso -->
  <rect x="198" y="135" width="104" height="140" rx="12" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <!-- Left arm -->
  <rect x="160" y="138" width="36" height="100" rx="16" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <!-- Right arm -->
  <rect x="304" y="138" width="36" height="100" rx="16" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <!-- Left leg -->
  <rect x="205" y="272" width="38" height="95" rx="14" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <!-- Right leg -->
  <rect x="257" y="272" width="38" height="95" rx="14" fill="#fff3e0" stroke="#333" stroke-width="2"/>

  <!-- C: Pituitary gland (at head/brain) -->
  <ellipse cx="250" cy="68" rx="9" ry="7" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
  <!-- Arrow and label C -->
  <line x1="260" y1="65" x2="340" y2="42" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="344" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">C</text>
  <text x="344" y="52" font-family="Arial, sans-serif" font-size="11" fill="#b71c1c">Pituitary Gland</text>
  <text x="344" y="65" font-family="Arial, sans-serif" font-size="10" fill="#555">(Master gland,</text>
  <text x="344" y="77" font-family="Arial, sans-serif" font-size="10" fill="#555">in brain)</text>

  <!-- A: Thyroid gland (at neck) -->
  <ellipse cx="250" cy="126" rx="16" ry="8" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <!-- Arrow and label A -->
  <line x1="235" y1="126" x2="150" y2="118" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="108" y="114" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">A</text>
  <text x="108" y="128" font-family="Arial, sans-serif" font-size="11" fill="#0d47a1">Thyroid Gland</text>
  <text x="108" y="141" font-family="Arial, sans-serif" font-size="10" fill="#555">(Controls growth</text>
  <text x="108" y="153" font-family="Arial, sans-serif" font-size="10" fill="#555">&amp; metabolism)</text>

  <!-- B: Adrenal glands (above kidneys, mid-torso) -->
  <!-- Left adrenal -->
  <ellipse cx="218" cy="215" rx="10" ry="7" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <!-- Right adrenal -->
  <ellipse cx="282" cy="215" rx="10" ry="7" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
  <!-- Arrow and label B -->
  <line x1="292" y1="215" x2="360" y2="215" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="364" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="black">B</text>
  <text x="364" y="225" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">Adrenal Glands</text>
  <text x="364" y="238" font-family="Arial, sans-serif" font-size="10" fill="#555">(Above kidneys,</text>
  <text x="364" y="250" font-family="Arial, sans-serif" font-size="10" fill="#555">secrete adrenaline)</text>

  <!-- Legend -->
  <text x="250" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    A: Thyroid   B: Adrenal   C: Pituitary
  </text>
  <text x="250" y="367" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777">
    Endocrine glands secrete hormones directly into the bloodstream
  </text>
</svg>
