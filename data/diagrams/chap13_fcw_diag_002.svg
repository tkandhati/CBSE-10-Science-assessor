<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">Food Web — Figure B</text>

  <!-- Trophic level labels on left -->
  <text x="12" y="360" font-family="Arial, sans-serif" font-size="10" fill="#777">Producer</text>
  <text x="12" y="270" font-family="Arial, sans-serif" font-size="10" fill="#777">Herbivore</text>
  <text x="12" y="185" font-family="Arial, sans-serif" font-size="10" fill="#777">Carnivore</text>
  <text x="12" y="100" font-family="Arial, sans-serif" font-size="10" fill="#777">Top</text>
  <text x="8" y="112" font-family="Arial, sans-serif" font-size="10" fill="#777">Predator</text>

  <!--
    Nodes:
    Grass:        (250, 350) — producer
    Grasshopper:  (120, 265)
    Rabbit:       (250, 265)
    Deer:         (380, 265)
    Frog:         (120, 180)
    Fox:          (310, 180)
    Tiger:        (430, 100)
    Snake:        (120, 100)
    Eagle:        (280, 55)
  -->

  <!-- Helper: define arrow marker -->
  <defs>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Arrows (directed edges showing energy flow) -->
  <!-- Grass → Grasshopper -->
  <line x1="236" y1="338" x2="132" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Grass → Rabbit -->
  <line x1="250" y1="338" x2="250" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Grass → Deer -->
  <line x1="264" y1="338" x2="368" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Grasshopper → Frog -->
  <line x1="120" y1="253" x2="120" y2="193" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Rabbit → Fox -->
  <line x1="263" y1="255" x2="298" y2="193" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Deer → Tiger -->
  <line x1="394" y1="253" x2="422" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Frog → Snake -->
  <line x1="120" y1="168" x2="120" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Snake → Eagle -->
  <line x1="133" y1="92" x2="265" y2="64" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Fox → Eagle -->
  <line x1="318" y1="168" x2="287" y2="70" stroke="#555" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <!-- Tiger → (apex, no further predator — optional label) -->

  <!-- Node: Grass (250, 350) -->
  <ellipse cx="250" cy="350" rx="42" ry="18" fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
  <text x="250" y="354" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#1b5e20">Grass</text>

  <!-- Node: Grasshopper (120, 265) -->
  <ellipse cx="120" cy="265" rx="48" ry="18" fill="#fff176" stroke="#f9a825" stroke-width="2"/>
  <text x="120" y="269" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#e65100">Grasshopper</text>

  <!-- Node: Rabbit (250, 265) -->
  <ellipse cx="250" cy="265" rx="36" ry="18" fill="#fff176" stroke="#f9a825" stroke-width="2"/>
  <text x="250" y="269" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#e65100">Rabbit</text>

  <!-- Node: Deer (380, 265) -->
  <ellipse cx="380" cy="265" rx="36" ry="18" fill="#fff176" stroke="#f9a825" stroke-width="2"/>
  <text x="380" y="269" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#e65100">Deer</text>

  <!-- Node: Frog (120, 180) -->
  <ellipse cx="120" cy="180" rx="34" ry="18" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="120" y="184" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#bf360c">Frog</text>

  <!-- Node: Fox (310, 180) -->
  <ellipse cx="310" cy="180" rx="34" ry="18" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="310" y="184" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#bf360c">Fox</text>

  <!-- Node: Snake (120, 100) -->
  <ellipse cx="120" cy="100" rx="34" ry="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="120" y="104" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#b71c1c">Snake</text>

  <!-- Node: Eagle (280, 55) -->
  <ellipse cx="280" cy="55" rx="36" ry="18" fill="#e53935" stroke="#b71c1c" stroke-width="2"/>
  <text x="280" y="59" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="white">Eagle</text>

  <!-- Node: Tiger (430, 100) -->
  <ellipse cx="430" cy="100" rx="34" ry="18" fill="#ef9a9a" stroke="#c62828" stroke-width="2"/>
  <text x="430" y="104" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#b71c1c">Tiger</text>

  <!-- Arrow from Tiger also to Eagle? Not always — tigers apex alone, skip for clarity -->
</svg>
