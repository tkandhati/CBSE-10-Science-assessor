<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
        text-anchor="middle" fill="black">Displacement Reaction</text>

  <!-- LEFT BEAKER: Before -->
  <!-- Beaker body -->
  <rect x="40" y="80" width="160" height="160" rx="4" fill="#cce5ff" stroke="black" stroke-width="2"/>
  <!-- Beaker rim -->
  <rect x="35" y="74" width="170" height="12" rx="3" fill="none" stroke="black" stroke-width="2"/>
  <!-- Beaker base -->
  <rect x="50" y="238" width="140" height="8" rx="2" fill="none" stroke="black" stroke-width="2"/>
  <!-- Iron nails (gray rectangles) -->
  <rect x="90" y="110" width="8" height="90" rx="2" fill="#888" stroke="#555" stroke-width="1"/>
  <rect x="108" y="115" width="8" height="85" rx="2" fill="#888" stroke="#555" stroke-width="1"/>
  <rect x="126" y="112" width="8" height="88" rx="2" fill="#888" stroke="#555" stroke-width="1"/>
  <!-- "Before" label -->
  <text x="120" y="68" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">Before</text>
  <!-- Labels -->
  <text x="120" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Iron nails</text>
  <text x="120" y="286" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0055aa">Blue CuSO₄ solution</text>

  <!-- RIGHT BEAKER: After -->
  <rect x="300" y="80" width="160" height="160" rx="4" fill="#d4f0d4" stroke="black" stroke-width="2"/>
  <rect x="295" y="74" width="170" height="12" rx="3" fill="none" stroke="black" stroke-width="2"/>
  <rect x="310" y="238" width="140" height="8" rx="2" fill="none" stroke="black" stroke-width="2"/>
  <!-- Copper-coated nails (reddish/brown) -->
  <rect x="350" y="110" width="8" height="90" rx="2" fill="#b87333" stroke="#8b4513" stroke-width="1"/>
  <rect x="368" y="115" width="8" height="85" rx="2" fill="#b87333" stroke="#8b4513" stroke-width="1"/>
  <rect x="386" y="112" width="8" height="88" rx="2" fill="#b87333" stroke="#8b4513" stroke-width="1"/>
  <!-- "After" label -->
  <text x="380" y="68" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">After</text>
  <!-- Labels -->
  <text x="380" y="270" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#8b4513">Copper deposited on nails</text>
  <text x="380" y="286" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#2d6a2d">Pale green FeSO₄ solution</text>

  <!-- Arrow between beakers -->
  <line x1="215" y1="160" x2="288" y2="160" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="black"/>
    </marker>
  </defs>

  <!-- Reaction equation -->
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Fe + CuSO₄ → FeSO₄ + Cu
  </text>
  <text x="250" y="350" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    (Iron displaces copper from copper sulphate solution)
  </text>
</svg>
