<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">Energy Pyramid — Figure A</text>

  <!--
    Pyramid with 4 levels. Each level is a trapezoid.
    Bottom (Level I) widest, top (Level IV) narrowest.
    Full width at bottom: 400px, top: 60px.
    Each level height: 65px.
    Pyramid bottom y=340, top y=60.
  -->

  <!-- Level I: Producers (bottom, widest) — green -->
  <polygon points="50,340 450,340 410,275 90,275" fill="#66bb6a" stroke="#2e7d32" stroke-width="1.5"/>
  <!-- Level II: Primary Consumers — yellow-green -->
  <polygon points="90,275 410,275 360,210 140,210" fill="#d4e157" stroke="#827717" stroke-width="1.5"/>
  <!-- Level III: Secondary Consumers — orange -->
  <polygon points="140,210 360,210 310,145 190,145" fill="#ffa726" stroke="#e65100" stroke-width="1.5"/>
  <!-- Level IV: Tertiary Consumers (top, narrowest) — red -->
  <polygon points="190,145 310,145 265,80 235,80" fill="#ef5350" stroke="#b71c1c" stroke-width="1.5"/>

  <!-- Level labels (text inside each band) -->
  <text x="250" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="#1b5e20">Producers</text>
  <text x="250" y="332" font-family="Arial, sans-serif" font-size="12"
        text-anchor="middle" fill="#1b5e20">10,000 J</text>

  <text x="250" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#33691e">Primary Consumers</text>
  <text x="250" y="268" font-family="Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#33691e">1,000 J</text>

  <text x="250" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#bf360c">Secondary Consumers</text>
  <text x="250" y="203" font-family="Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#bf360c">100 J</text>

  <text x="250" y="122" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#b71c1c">Tertiary Consumers</text>
  <text x="250" y="137" font-family="Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#b71c1c">10 J</text>

  <!-- Level labels on left side: I, II, III, IV -->
  <text x="42" y="316" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="end" fill="#2e7d32">I</text>
  <text x="82" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="end" fill="#33691e">II</text>
  <text x="132" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="end" fill="#bf360c">III</text>
  <text x="183" y="122" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="end" fill="#b71c1c">IV</text>

  <!-- Arrow on right side pointing upward: Energy flow -->
  <line x1="468" y1="335" x2="468" y2="90" stroke="#333" stroke-width="2"
        marker-end="url(#upArrow)"/>
  <text x="490" y="215" font-family="Arial, sans-serif" font-size="11" fill="#333"
        transform="rotate(90 490 215)">Energy flow</text>
  <defs>
    <marker id="upArrow" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 6, 4 0, 8 6" fill="#333"/>
    </marker>
  </defs>

  <!-- 10% rule note -->
  <text x="250" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    Only 10% of energy is transferred to the next trophic level (10% law)
  </text>
</svg>
