<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        text-anchor="middle" fill="black">Waste Management Strategies — Figure C</text>

  <!-- Central circle: Waste Management -->
  <circle cx="250" cy="195" r="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#0d47a1">Waste</text>
  <text x="250" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#0d47a1">Management</text>

  <!--
    5 spokes at 72° apart. Starting from top (270° = -90°).
    Spoke positions (distance ~130px from centre at 250,195):
    1. Refuse    = top    = 250, 65    (270°)
    2. Reduce    = top-right = ~360, 110  (342°)
    3. Reuse     = bottom-right = ~390, 250 (54°)
    4. Repurpose = bottom-left = ~140, 295 (126°)
    5. Recycle   = top-left = ~115, 115  (198°)
    Let r = 130:
    1. (250, 195-130) = (250,  65)
    2. (250+130*sin72, 195-130*cos72) = (250+123.6, 195-40.2) ≈ (374, 155)
    3. (250+130*sin144, 195-130*cos144) ≈ (250+76.5, 195+105.2) = (327, 300)
    4. (250-130*sin144, 195+130*cos144) ≈ (174, 300)
    5. (250-130*sin72, 195-130*cos72) ≈ (127, 155)
  -->

  <!-- Spoke lines from centre -->
  <line x1="250" y1="140" x2="250" y2="90" stroke="#555" stroke-width="2"/>
  <line x1="250" y1="140" x2="368" y2="160" stroke="#555" stroke-width="2"/>
  <line x1="250" y1="250" x2="320" y2="295" stroke="#555" stroke-width="2"/>
  <line x1="250" y1="250" x2="180" y2="295" stroke="#555" stroke-width="2"/>
  <line x1="250" y1="140" x2="132" y2="160" stroke="#555" stroke-width="2"/>

  <!-- Node circles at spoke ends -->
  <!-- 1. Refuse (top) -->
  <circle cx="250" cy="68" r="36" fill="#ef5350" stroke="#b71c1c" stroke-width="2"/>
  <text x="250" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="white">Refuse</text>
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="9"
        text-anchor="middle" fill="#ffe0e0">Say no to waste</text>

  <!-- 2. Reduce (top-right) -->
  <circle cx="375" cy="155" r="36" fill="#ffa726" stroke="#e65100" stroke-width="2"/>
  <text x="375" y="151" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="white">Reduce</text>
  <text x="375" y="167" font-family="Arial, sans-serif" font-size="9"
        text-anchor="middle" fill="#fff3e0">Use less</text>

  <!-- 3. Reuse (bottom-right) -->
  <circle cx="325" cy="300" r="36" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
  <text x="325" y="296" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="white">Reuse</text>
  <text x="325" y="312" font-family="Arial, sans-serif" font-size="9"
        text-anchor="middle" fill="#e8f5e9">Use again</text>

  <!-- 4. Repurpose (bottom-left) -->
  <circle cx="175" cy="300" r="36" fill="#ab47bc" stroke="#6a1b9a" stroke-width="2"/>
  <text x="175" y="296" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="white">Repurpose</text>
  <text x="175" y="312" font-family="Arial, sans-serif" font-size="9"
        text-anchor="middle" fill="#f3e5f5">New use</text>

  <!-- 5. Recycle (top-left) -->
  <circle cx="125" cy="155" r="36" fill="#26c6da" stroke="#00838f" stroke-width="2"/>
  <text x="125" y="151" font-family="Arial, sans-serif" font-size="13" font-weight="bold"
        text-anchor="middle" fill="white">Recycle</text>
  <text x="125" y="167" font-family="Arial, sans-serif" font-size="9"
        text-anchor="middle" fill="#e0f7fa">Process again</text>

  <!-- Footer note -->
  <text x="250" y="355" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#555">
    The 5Rs of Waste Management — hierarchy from most to least preferred
  </text>
  <text x="250" y="371" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#777">
    Refuse → Reduce → Reuse → Repurpose → Recycle
  </text>
</svg>
