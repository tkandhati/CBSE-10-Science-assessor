<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <rect width="500" height="380" fill="white"/>

  <!-- Title -->
  <text x="250" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold"
        text-anchor="middle" fill="black">Electrolytic Refining of Copper</text>

  <!-- Battery symbol at top centre -->
  <!-- Long line = positive, short = negative -->
  <line x1="190" y1="60" x2="210" y2="60" stroke="black" stroke-width="3"/>
  <line x1="215" y1="55" x2="215" y2="65" stroke="black" stroke-width="1.5"/>
  <line x1="220" y1="58" x2="220" y2="62" stroke="black" stroke-width="1.5"/>
  <line x1="225" y1="55" x2="225" y2="65" stroke="black" stroke-width="1.5"/>
  <line x1="230" y1="58" x2="230" y2="62" stroke="black" stroke-width="1.5"/>
  <line x1="235" y1="55" x2="235" y2="65" stroke="black" stroke-width="1.5"/>
  <line x1="240" y1="58" x2="240" y2="62" stroke="black" stroke-width="1.5"/>
  <line x1="245" y1="60" x2="310" y2="60" stroke="black" stroke-width="3"/>
  <text x="200" y="52" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">+ (Anode)</text>
  <text x="300" y="52" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="black">(Cathode) −</text>
  <text x="250" y="46" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="black">Battery</text>

  <!-- Wires from battery to electrodes -->
  <line x1="190" y1="60" x2="150" y2="60" stroke="black" stroke-width="2"/>
  <line x1="150" y1="60" x2="150" y2="100" stroke="black" stroke-width="2"/>
  <line x1="310" y1="60" x2="350" y2="60" stroke="black" stroke-width="2"/>
  <line x1="350" y1="60" x2="350" y2="100" stroke="black" stroke-width="2"/>

  <!-- Electrolytic beaker / tank -->
  <rect x="80" y="100" width="340" height="200" rx="6" fill="#e8f4fd" stroke="black" stroke-width="2.5"/>
  <!-- Electrolyte label -->
  <text x="250" y="310" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0055aa">CuSO₄ solution (Electrolyte)</text>

  <!-- Anode (left electrode — impure copper) -->
  <rect x="135" y="95" width="30" height="185" rx="4" fill="#b87333" stroke="#7a4f1e" stroke-width="2"/>
  <text x="150" y="90" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7a4f1e">+</text>

  <!-- Cathode (right electrode — pure copper) -->
  <rect x="335" y="100" width="30" height="170" rx="4" fill="#e8a060" stroke="#7a4f1e" stroke-width="2"/>
  <text x="350" y="96" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0055aa">−</text>

  <!-- Cu2+ ions migration arrows -->
  <line x1="200" y1="190" x2="300" y2="190" stroke="#0055aa" stroke-width="1.5"
        stroke-dasharray="6,4" marker-end="url(#blueArrow)"/>
  <text x="250" y="183" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#0055aa">Cu²⁺ ions</text>

  <!-- Impurity blob at bottom of anode -->
  <ellipse cx="150" cy="280" rx="22" ry="8" fill="#666" stroke="#444" stroke-width="1"/>
  <text x="150" y="298" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#444">Anode mud</text>
  <text x="150" y="309" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#444">(impurities)</text>

  <!-- Labels below the tank -->
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#7a4f1e">A (Impure copper</text>
  <text x="150" y="344" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#7a4f1e">/ Anode)</text>
  <text x="350" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#2d6a2d">B (Pure copper</text>
  <text x="350" y="344" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
        text-anchor="middle" fill="#2d6a2d">/ Cathode)</text>

  <defs>
    <marker id="blueArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0055aa"/>
    </marker>
  </defs>
</svg>
